[package]
name = "potato-stream"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
bytes = "1.10.0"
clap = { version = "4.5.26", features = ["derive"] }
dittolive-ditto = { path = "../../commercial/ditto/rust/dittolive-ditto", features = [
    "experimental-bus",
] }
opencv = { version = "0.94.1", features = ["clang-runtime"], optional = true }
pretty_assertions = "1.4.1"
safer-ffi = "0.1.13"
serde = { version = "1.0.218", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.135"
str0m = "0.7.0"
thiserror = "2.0.12"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[features]
default = ["media"]
# Deactivate if you only want to use app as repeater.
media = ["dep:opencv"]
